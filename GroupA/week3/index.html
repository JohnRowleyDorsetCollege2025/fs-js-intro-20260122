<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./js/site.js"></script>
    <script src="./js/car.js"></script>

    <title>Document</title>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-3">
                <input class="form-control" type="text" id="tbFlavour" placeholder="What is your favourite flavour" />

            </div>
            <div class="col-md-3">
                <button class="btn btn-primary" onclick="btnSave()">Save</button>

            </div>
            <div class="col-md-3">
                <button class="btn btn-primary" onclick="btnRetrieveFlavour()">Retrieve</button>
            </div>

        </div>
        <hr />



        <div class="row">

            <div class="col-md-4">
                <input class="form-control" type="text" id="tbMf" placeholder="MF" />
                <input class="form-control" type="text" id="tbModel" placeholder="Model" />
                <input class="form-control" type="text" id="tbColour" placeholder="Colour" />
            </div>
            <div class="col-md-4">
                <button class="btn btn-primary" onclick="btnSaveCar()">Save Cars</button>
                <button class="btn btn-primary" onclick="btnRetrieveFleet()">Retrieve Fleet</button>
            </div>
            <div class="col-md-4">
                <table id="fleetTable" class="table table-striped">
                    <thead>
                        <tr>
                            <th>MF</th>
                            <th>Model</th>
                            <th>Colour</th>
                            <th>Remove</th>
                        </tr>
                    </thead>
                    <tbody id="fleetData"></tbody>

                </table>





            </div>


        </div>

    </div>
</body>

</html>
